<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vi Activation Message Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 650px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-wrapper {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s ease;
            font-family: inherit;
            background: white;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="text"]:hover,
        input[type="tel"]:hover,
        select:hover {
            border-color: #cbd5e0;
        }

        .required {
            color: #e53e3e;
        }

        .optional-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 2px dashed #e2e8f0;
        }

        .add-old-rental-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #f7fafc;
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            color: #667eea;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .add-old-rental-btn:hover {
            background: #edf2f7;
            border-color: #667eea;
            transform: translateY(-1px);
        }

        .add-old-rental-btn:active {
            transform: translateY(0);
        }

        .add-old-rental-btn .icon {
            font-size: 18px;
            font-weight: bold;
        }

        .old-rental-dropdown {
            display: none;
            margin-top: 16px;
            animation: slideDown 0.3s ease;
        }

        .old-rental-dropdown.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .remove-btn {
            background: #fff5f5;
            border-color: #fc8181;
            color: #e53e3e;
        }

        .remove-btn:hover {
            background: #fed7d7;
            border-color: #e53e3e;
        }

        /* Download Image Button */
        .download-img-btn {
            width: 100%;
            padding: 14px 16px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.3);
            font-family: inherit;
        }

        .download-img-btn.visible {
            display: flex;
        }

        .download-img-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.4);
        }

        .download-img-btn:active {
            transform: translateY(0);
        }

        .download-img-btn.downloaded {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
            box-shadow: 0 4px 12px rgba(86, 171, 47, 0.3);
        }

        /* Download status tip */
        .download-tip {
            display: none;
            margin-top: 8px;
            padding: 10px 14px;
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            border-radius: 8px;
            font-size: 13px;
            color: #276749;
            line-height: 1.5;
        }

        .download-tip.show {
            display: block;
        }

        .share-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }

        .share-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
        }

        .share-btn:active {
            transform: translateY(0);
        }

        .share-btn svg {
            width: 22px;
            height: 22px;
        }

        .preview {
            background: #f7fafc;
            padding: 24px;
            border-radius: 12px;
            margin-top: 32px;
            display: none;
            border: 2px solid #e2e8f0;
        }

        .preview.show {
            display: block;
        }

        .preview h3 {
            color: #2d3748;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preview-text {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #2d3748;
            line-height: 1.7;
            background: white;
            padding: 16px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
        }

        .info-badge {
            display: inline-block;
            background: #edf2f7;
            color: #4a5568;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 8px;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .form-wrapper {
                padding: 24px;
            }

            .header {
                padding: 24px;
            }

            .header h1 {
                font-size: 22px;
            }

            .container {
                border-radius: 12px;
            }
        }

        /* Custom scrollbar for preview */
        .preview-text::-webkit-scrollbar {
            width: 8px;
        }

        .preview-text::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .preview-text::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 4px;
        }

        .preview-text::-webkit-scrollbar-thumb:hover {
            background: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <span>📱</span>
                Vi Activation Message
            </h1>
            <p>Generate professional activation messages for WhatsApp</p>
        </div>

        <div class="form-wrapper">
            <form id="messageForm">
                <div class="form-group">
                    <label for="phoneNumber">WhatsApp Number <span class="required">*</span></label>
                    <input type="tel" id="phoneNumber" placeholder="Enter 10-digit number" maxlength="10" required>
                </div>

                <div class="form-group">
                    <label for="customerName">Customer Name <span class="required">*</span></label>
                    <input type="text" id="customerName" placeholder="Enter customer name" required>
                </div>

                <div class="form-group">
                    <label for="customerNumber">Customer New Number <span class="required">*</span></label>
                    <input type="tel" id="customerNumber" placeholder="Enter customer mobile number" maxlength="10" required>
                </div>

                <div class="form-group">
                    <label for="activationType">Activation Type <span class="required">*</span></label>
                    <select id="activationType" required>
                        <option value="">Select Type</option>
                        <option value="New">New</option>
                        <option value="MNP">MNP</option>
                        <option value="Pre to Post">Pre to Post</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="totalConnections">Total Connections <span class="required">*</span></label>
                    <select id="totalConnections" required>
                        <option value="">Select Connections</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="Addon 299">Addon 299</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="planRental">Plan Rental <span class="required">*</span></label>
                    <select id="planRental" required>
                        <option value="">Select Plan</option>
                        <option value="451" data-connections="1">₹451</option>
                        <option value="551" data-connections="1">₹551</option>
                        <option value="701" data-connections="2,3,4,5">₹701</option>
                        <option value="1000" data-connections="2,3,4,5">₹1000</option>
                        <option value="1201" data-connections="2,3,4,5">₹1201</option>
                        <option value="1401" data-connections="2,3,4,5">₹1401</option>
                        <option value="701U" data-connections="2,3,4,5" data-activation="MNP">₹701 Unlimited</option>
                        <option value="1000U" data-connections="2,3,4,5" data-activation="MNP">₹1000 Unlimited</option>
                        <option value="1201U" data-connections="2,3,4,5" data-activation="MNP">₹1201 Unlimited</option>
                        <option value="1401U" data-connections="2,3,4,5" data-activation="MNP">₹1401 Unlimited</option>
                    </select>
                </div>

                <!-- Optional Old Rental Section -->
                <div class="optional-section">
                    <button type="button" class="add-old-rental-btn" id="toggleOldRentalBtn">
                        <span class="icon">+</span>
                        <span class="btn-text">Add old plan rental</span>
                        <span class="info-badge">Optional</span>
                    </button>

                    <div class="old-rental-dropdown" id="oldRentalDropdown">
                        <div class="form-group">
                            <label for="oldPlanRental">Previous Plan Rental</label>
                            <select id="oldPlanRental">
                                <option value="">Select Previous Plan</option>
                                <option value="Below 299">Below ₹299</option>
                                <option value="351">₹351</option>
                                <option value="451">₹451</option>
                                <option value="551">₹551</option>
                                <option value="701">₹701</option>
                                <option value="1201">₹1201</option>
                                <option value="1401">₹1401</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Download Plan Image Button (shown when plan is selected) -->
                <button type="button" class="download-img-btn" id="downloadImgBtn">
                    🖼️ Download Plan Image
                </button>
                <div class="download-tip" id="downloadTip">
                    ✅ Image download ho rahi hai! WhatsApp mein 📎 (Attach) dabao → <strong>Gallery / Recent</strong> mein yeh photo milegi → Select karo → Send!
                </div>

                <button type="submit" class="share-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                    </svg>
                    Share via WhatsApp
                </button>

                <div class="preview" id="preview">
                    <h3>📝 Message Preview</h3>
                    <div class="preview-text" id="previewText"></div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('messageForm');
        const preview = document.getElementById('preview');
        const previewText = document.getElementById('previewText');
        const activationTypeSelect = document.getElementById('activationType');
        const totalConnectionsSelect = document.getElementById('totalConnections');
        const planRentalSelect = document.getElementById('planRental');
        const toggleOldRentalBtn = document.getElementById('toggleOldRentalBtn');
        const oldRentalDropdown = document.getElementById('oldRentalDropdown');
        const oldPlanRentalSelect = document.getElementById('oldPlanRental');
        const downloadImgBtn = document.getElementById('downloadImgBtn');
        const downloadTip = document.getElementById('downloadTip');

        // GitHub raw image base URL
        const IMAGE_BASE_URL = 'https://raw.githubusercontent.com/radheyent/plan/main/images/';

        // Plan to image file mapping (exact file names from GitHub)
        const planImageMap = {
            '451':  'VM451.jpeg',
            '551':  'VM551.jpeg',
            '701':  'VMF701.jpg',
            '1000': 'VMF1000.jpg',
            '1201': 'VMF1201.jpg',
            '1401': 'VMF1401.jpg',
        };

        // Discounted rental for Unlimited plans (₹100 off): base plan value -> discounted amount
        const unlimitedDiscountMap = {
            '701U': 601,
            '1000U': 899
        };

        let oldRentalVisible = false;
        let lastDownloadedPlan = null;

        // Toggle old rental section
        toggleOldRentalBtn.addEventListener('click', function() {
            oldRentalVisible = !oldRentalVisible;
            
            if (oldRentalVisible) {
                oldRentalDropdown.classList.add('show');
                toggleOldRentalBtn.classList.add('remove-btn');
                toggleOldRentalBtn.querySelector('.icon').textContent = '−';
                toggleOldRentalBtn.querySelector('.btn-text').textContent = 'Remove old plan rental';
            } else {
                oldRentalDropdown.classList.remove('show');
                toggleOldRentalBtn.classList.remove('remove-btn');
                toggleOldRentalBtn.querySelector('.icon').textContent = '+';
                toggleOldRentalBtn.querySelector('.btn-text').textContent = 'Add old plan rental';
                oldPlanRentalSelect.value = '';
            }
            
            updatePreview();
        });

        // Filter plan options by Total Connections AND Activation Type (Unlimited plans require MNP)
        function filterPlanOptions() {
            const selectedConnections = totalConnectionsSelect.value;
            const selectedActivation = activationTypeSelect.value;
            const planOptions = planRentalSelect.querySelectorAll('option');

            planOptions.forEach(option => {
                if (option.value === '') {
                    option.style.display = 'block';
                    return;
                }

                const allowedConnections = option.getAttribute('data-connections');
                const requiredActivation = option.getAttribute('data-activation');

                let visible;
                if (selectedConnections === '1') {
                    visible = allowedConnections === '1';
                } else if (selectedConnections === 'Addon 299') {
                    visible = true;
                } else {
                    visible = allowedConnections && allowedConnections.includes(selectedConnections);
                }

                if (requiredActivation && requiredActivation !== selectedActivation) {
                    visible = false;
                }

                option.style.display = visible ? 'block' : 'none';
            });
        }

        // Re-filter when Total Connections changes
        totalConnectionsSelect.addEventListener('change', function() {
            filterPlanOptions();
            planRentalSelect.value = '';
            updateDownloadButton('');
            updatePreview();
        });

        // Re-filter when Activation Type changes (Unlimited plans are MNP-only)
        activationTypeSelect.addEventListener('change', function() {
            filterPlanOptions();
            planRentalSelect.value = '';
            updateDownloadButton('');
            updatePreview();
        });

        // Show/hide download button when plan changes
        planRentalSelect.addEventListener('change', function() {
            updateDownloadButton(this.value);
            updatePreview();
        });

        function updateDownloadButton(plan) {
            if (plan && planImageMap[plan]) {
                downloadImgBtn.classList.add('visible');
                // Reset button state if plan changed
                if (lastDownloadedPlan !== plan) {
                    downloadImgBtn.classList.remove('downloaded');
                    downloadImgBtn.textContent = '🖼️ Download Plan Image';
                    downloadTip.classList.remove('show');
                }
            } else {
                downloadImgBtn.classList.remove('visible');
                downloadImgBtn.classList.remove('downloaded');
                downloadTip.classList.remove('show');
            }
        }

        // Download plan image on button click
        downloadImgBtn.addEventListener('click', function() {
            const plan = planRentalSelect.value;
            if (!plan || !planImageMap[plan]) return;

            const fileName = planImageMap[plan];
            const imageUrl = IMAGE_BASE_URL + fileName;

            // Create invisible anchor and trigger download
            const a = document.createElement('a');
            a.href = imageUrl;
            a.download = fileName;
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            // Update button to "Downloaded" state
            lastDownloadedPlan = plan;
            downloadImgBtn.classList.add('downloaded');
            downloadImgBtn.textContent = '✅ Image Downloaded!';
            downloadTip.classList.add('show');
        });

        // Update preview on input change
        form.addEventListener('input', updatePreview);
        form.addEventListener('change', updatePreview);

        function updatePreview() {
            const message = generateMessage();
            if (message) {
                previewText.textContent = message;
                preview.classList.add('show');
            }
        }

        function generateMessage() {
            const customerName = document.getElementById('customerName').value;
            const customerNumber = document.getElementById('customerNumber').value;
            const activationType = document.getElementById('activationType').value;
            const totalConnections = document.getElementById('totalConnections').value;
            const planRental = document.getElementById('planRental').value;
            const oldPlanRental = oldPlanRentalSelect.value;

            if (!customerName || !customerNumber || !activationType || !totalConnections || !planRental) {
                return '';
            }

            let primaryData, shareableData;
            
            switch(planRental) {
                case '451':
                    return generate451Message(customerName, customerNumber, activationType, oldPlanRental);
                case '551':
                    return generate551Message(customerName, customerNumber, activationType, oldPlanRental);
                case '701':
                case '1000':
                    primaryData = '70GB';
                    shareableData = '10GB';
                    break;
                case '1201':
                case '1401':
                    primaryData = '140GB';
                    shareableData = '20GB';
                    break;
                case '701U':
                case '1000U':
                case '1201U':
                case '1401U':
                    // Unlimited plans - no fixed data quota
                    primaryData = null;
                    shareableData = null;
                    break;
            }

            return generateFamilyMessage(customerName, customerNumber, activationType, totalConnections, planRental, primaryData, shareableData, oldPlanRental);
        }

        function generate451Message(customerName, customerNumber, activationType, oldPlanRental) {
            let message = `Namaskar ${customerName} ji,
Your ${activationType} Number ${customerNumber} Taken Request for.
*1 Connections Plan*
💰 Monthly Rental: ₹451/- Only`;

            if (oldPlanRental) {
                const oldRentalDisplay = oldPlanRental === 'Below 299' ? oldPlanRental : `₹${oldPlanRental}`;
                message += `\n📊 Your Previous Rental was: ${oldRentalDisplay}`;
            }

            message += `
━━━━━━━━━━━━
👑 Benefits
📶 50GB Data with 200GB Rollover
🌙 Unlimited Night Data
⚡ Unlimited 5G (Area+Handset)*
📞 Unlimited Calls (All India)
✉️ 3000 SMS / Month (All India)
━━━━━━━━━━━━
🎁 ANY 1 COMPLIMENTARY BENEFITS
🎬 JioHotstar 1Y
📺 Sony LIV 1Y
_Read Plan Details here :www.myvi.in/postpaid/vi-postpaid-plans_
━━━━━━━━━━━━
➕all charges gst as per applicable govt. norms
➕ Extra Family SIM Option
━━━━━━━━━━━━
🔐 Customer Declaration :
✔️ SIM card & numbers received at my premises
✔️ No hard copy / photo copy provided to agent and activation completed via digital process
✔️ No any Visit Charges Given to Agent
📍 *Accept? Reply "YES"* or No`;

            return message;
        }

        function generate551Message(customerName, customerNumber, activationType, oldPlanRental) {
            let message = `Namaskar ${customerName} ji,
Your ${activationType} Number ${customerNumber} Taken Request for.
*1 Connections Plan*
💰 Monthly Rental: ₹551/- Only`;

            if (oldPlanRental) {
                const oldRentalDisplay = oldPlanRental === 'Below 299' ? oldPlanRental : `₹${oldPlanRental}`;
                message += `\n📊 Your Previous Rental was: ${oldRentalDisplay}`;
            }

            message += `
━━━━━━━━━━━━
👑 Benefits
📶 90GB Data with 200GB Rollover
🌙 Unlimited Night Data
⚡ Unlimited 5G(Area+Handset)*
📞 Unlimited Calls (All India)
✉️ 3000 SMS / Month (All India)
━━━━━━━━━━━━
🎁 ANY 1 COMPLIMENTARY BENEFITS
🎬 JioHotstar 1Y
🎬 Amazon Prime 6M
📺 Sony LIV 1Y
_Read Plan Details here :www.myvi.in/postpaid/vi-postpaid-plans_
━━━━━━━━━━━━
➕all charges gst as per applicable govt. norms
➕ Extra Family SIM Option
━━━━━━━━━━━━
🔐 Customer Declaration :
✔️ SIM card & numbers received at my premises
✔️ No hard copy / photo copy provided to agent and activation completed via digital process
✔️ No any Visit Charges Given to Agent
📍 *Accept? Reply "YES"* or No`;

            return message;
        }

        function generateFamilyMessage(customerName, customerNumber, activationType, totalConnections, planRental, primaryData, shareableData, oldPlanRental) {
            const isUnlimited = planRental.endsWith('U');
            const baseRental = isUnlimited ? planRental.slice(0, -1) : planRental;
            const discountedRental = unlimitedDiscountMap[planRental];

            const rentalLine = discountedRental
                ? `💰 Monthly Rental: ~₹${baseRental}~ ₹${discountedRental}/- Only`
